name: Repository harness
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Python ${{ matrix.python }} / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.12'
            profile: full
          - python: '3.13'
            profile: core
          - python: '3.14'
            profile: core
    env:
      HARNESS_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.4'
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            studio/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        if: matrix.profile == 'full'
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: studio/web/package-lock.json
      - name: Provision locked browser tooling
        if: matrix.profile == 'full'
        run: |
          npm --prefix studio/web ci --ignore-scripts
          cd studio/web
          npx --no-install playwright install --with-deps chromium
      - name: Run repository verification
        run: python scripts/verify.py --profile "${{ matrix.profile }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-${{ matrix.python }}-${{ matrix.profile }}
          path: .verification/harness/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
  summary:
    name: Harness required
    if: always()
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix job to pass
        env:
          RESULT: ${{ needs.verify.result }}
        run: test "$RESULT" = success
