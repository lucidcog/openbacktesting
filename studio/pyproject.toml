[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "openbacktesting-studio"
version = "0.1.0"
description = "Local strategy workspace for OpenBacktesting"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.15"
dependencies = [
    "openbacktesting>=0.2.0,<0.3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2.10,<3",
    "packaging>=24,<27",
    "jsonschema>=4.23,<5",
]

[project.scripts]
openbacktesting-studio = "openbacktesting_studio.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.4,<10", "httpx>=0.28,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/openbacktesting_studio"]
artifacts = ["src/openbacktesting_studio/web/**"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/pyproject.toml", "/vendor-metadata", "/docs", "/uv.lock", "/hatch_build.py"]
exclude = ["**/__pycache__", "**/*.pyc", "**/.pytest_cache"]
artifacts = ["src/openbacktesting_studio/web/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
